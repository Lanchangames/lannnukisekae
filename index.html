<!-- iPhoneホーム画面用アイコンの設定 -->
<!-- <link rel="apple-touch-icon" href="avator.png"> -->

<style>
    :root {
        --primary: #2c3e50;
        --secondary: #34495e;
        --accent: #3498db;
        --bg: #ecf0f1;
        --text: #333;
    }
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    
    /* スタート画面のスタイル追加 */
    #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    #start-box {
        background: white;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 90%;
        max-width: 500px;
    }
    #logo-img {
        max-width: 100%;
        max-height: 180px;
        margin-bottom: 20px;
        object-fit: contain;
    }

    #game-container {
        display: flex;
        gap: 20px;
        width: 950px;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-height: 90vh;
    }
    /* アバターエリア (左側) */
    #avatar-area {
        position: relative; /* 追従(sticky)を解除し、通常の配置に戻しました */
        width: 300px;
        height: 400px;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        overflow: hidden;
        background-color: #fff;
        flex-shrink: 0;
    }
    .avatar-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
    }
    /* メインUIエリア (右側) */
    #ui-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow-y: auto;
        padding-right: 10px;
        padding-bottom: 50px; /* スクロール下部に余裕を持たせる余白を追加 */
    }
    #lancelot-area {
        display: flex;
        gap: 10px;
        background: #e8f4f8;
        padding: 15px;
        border-radius: 8px;
        border-left: 5px solid var(--accent);
        flex-shrink: 0;
    }
    #lancelot-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 50%;
        background: #ccc;
        flex-shrink: 0;
    }
    /* タイプライター演出のために改行指定を追加 */
    #message-box {
        flex: 1;
        font-size: 16px;
        line-height: 1.5;
        display: flex;
        align-items: center;
        white-space: pre-wrap;
    }
    /* ステータス・入力系 */
    .status-box {
        display: flex;
        justify-content: space-between;
        background: var(--primary);
        color: white;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: bold;
        flex-shrink: 0;
    }
    .input-group {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-shrink: 0;
    }
    input[type="number"] {
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        flex: 1;
    }
    button {
        padding: 10px 20px;
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
    }
    button:hover {
        background-color: #2980b9;
    }
    button:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
    }
    #cooldown-text {
        color: #e74c3c;
        font-size: 14px;
        font-weight: bold;
    }
    
    /* ショップ・クローゼットUI */
    .shop-area {
        border-top: 1px solid #eee;
        padding-top: 15px;
    }
    .shop-category {
        margin-bottom: 15px;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 8px;
    }
    h3 { margin: 0 0 10px 0; color: var(--primary); }
    h4 { margin: 0 0 10px 0; color: var(--secondary); font-size: 14px; }
    
    .item-btn, .equip-btn {
        margin: 4px;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
    }
    /* 未開放用ボタン */
    .item-btn { background-color: #7f8c8d; }
    .item-btn:hover { background-color: #95a5a6; }
    /* クローゼット用ボタン */
    .equip-btn { background-color: #8e44ad; }
    .equip-btn:hover { background-color: #9b59b6; }
    /* 装備中アピール */
    .equip-btn.active-equip { background-color: #e67e22; border: 2px solid #d35400; padding: 6px 10px; }
    
    /* プレビュー枠 */
    #preview-panel {
        display: flex;
        gap: 15px;
        background: #e8f4f8;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        align-items: center;
    }
    #preview-img-container {
        width: 100px;
        height: 120px;
        background: rgba(255, 255, 255, 0.7);
        background-image: linear-gradient(45deg, #ddd 25%, transparent 25%), linear-gradient(-45deg, #ddd 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ddd 75%), linear-gradient(-45deg, transparent 75%, #ddd 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        border-radius: 4px;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #preview-img {
        max-width: 90%;
        max-height: 90%;
        display: none;
        object-fit: contain;
    }
    .preview-info { flex: 1; }
    .preview-info p { margin: 5px 0 15px 0; font-size: 14px; }
    
    /* ショップ内タブ切り替えデザイン */
    .tab-container {
        display: flex;
        gap: 5px;
        border-bottom: 2px solid var(--primary);
        padding-bottom: 5px;
    }
    .tab-btn {
        background-color: #ecf0f1;
        color: var(--secondary);
        border: 1px solid #bdc3c7;
        padding: 8px 15px;
        font-size: 14px;
        border-radius: 4px 4px 0 0;
        cursor: pointer;
        font-weight: bold;
    }
    .tab-btn.active {
        background-color: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    /* ----- スマホ専用ナビゲーション・レイアウト設定 ----- */
    #mobile-nav { display: none; }
    /* PC環境ではラッパーの存在を無視し、元のFlexbox列挙を維持 */
    #section-main, #section-shop { display: contents; }

    @media (max-width: 768px) {
        #game-container {
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
            max-height: none;
            padding: 10px;
            gap: 10px;
        }
        body { padding: 0 0 50px 0; } /* スマホ版の下部にも余白を追加 */
        
        #avatar-area {
            width: 100%;
            /* 圧迫感を無くすため縮小 */
            max-width: 210px;
            height: 280px; 
            margin: 0 auto;
            /* sticky と 影を削除し、文書内に素直に配置（固定）されるように変更 */
            position: relative;
        }
        #ui-area {
            overflow-y: visible;
            padding-right: 0;
        }
        
        /* スマホ専用切り替えタブ */
        #mobile-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .m-tab-btn {
            flex: 1;
            padding: 12px;
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            font-weight: bold;
            color: var(--secondary);
            text-align: center;
            cursor: pointer;
        }
        .m-tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* スマホ環境ではコンテンツを独立したブロックとして扱う */
        #section-main, #section-shop {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* タブの表示・非表示ロジック */
        #ui-area.show-main #section-shop { display: none !important; }
        #ui-area.show-shop #section-main { display: none !important; }

        .status-box {
            font-size: 14px;
            flex-wrap: wrap;
        }
        .input-group {
            flex-direction: column;
            align-items: stretch;
        }
        #preview-panel {
            flex-direction: column;
            text-align: center;
        }
    }

    /* ----- 追加: 購入エフェクト用アニメーション ----- */
    @keyframes purchaseEffect {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { transform: translateY(-10px) scale(1.2); opacity: 1; }
        100% { transform: translateY(-40px) scale(1); opacity: 0; }
    }
</style>
